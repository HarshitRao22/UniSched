spring:
  application:
    name: Exam Scheduling System
  
  datasource:
    url: jdbc:mysql://localhost:3306/exam_scheduler_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: ""
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
        use_sql_comments: true
    show-sql: false
    open-in-view: false
  
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

server:
  servlet:
    context-path: /api
  port: 8080
  error:
    include-message: always
    include-stacktrace: on-param

logging:
  level:
    root: INFO
    com.examscheduler: DEBUG
    org.hibernate.SQL: DEBUG

# JWT Configuration
app:
  jwt:
    secret: exam-scheduler-secret-key-please-change-in-production-environment
    expiration: 86400000 # 24 hours in milliseconds
    refresh-expiration: 604800000 # 7 days in milliseconds
  
  cors:
    allowed-origins: http://localhost:3000,http://localhost:5173
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS,PATCH
    allowed-headers: "*"
    allow-credentials: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    csrf:
      enabled: false
  api-docs:
    path: /v3/api-docs
